[package]
name = "equides-api"
version = "1.0.0"
edition = "2024"
rust-version = "1.90"
description = "API Équidés: API REST ouverte sur les fiches publiques d'équidés de l'IFCE. Service indépendant, non affilié à l'IFCE."
repository = "https://github.com/Collectif-Pixel/api-equides"
license = "MIT"
readme = "README.md"
keywords = ["opendata", "equides", "api", "datagouv", "pedigree"]
categories = ["web-programming::http-server"]

[[bin]]
name = "equides-api"
path = "src/main.rs"

[[bin]]
name = "equides-ingest"
path = "src/bin/ingest.rs"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"
similar_names = "allow"
items_after_statements = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
unreadable_literal = "allow"
many_single_char_names = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[dependencies]
anyhow = "1"
axum = "0.8"
blake3 = "1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
data-encoding = "2"
form_urlencoded = "1"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
roaring = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "net"] }
tokio-stream = "0.1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "compression-full", "trace", "timeout", "set-header", "catch-panic", "normalize-path"] }
governor = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
